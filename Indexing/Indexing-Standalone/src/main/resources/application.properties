# LlamaIndex Java Configuration File
# Place this file in src/main/resources/ or provide at runtime

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY}
openai.embedding.model=text-embedding-3-small
openai.llm.model=gpt-4o-mini

# Timeout Configuration (milliseconds)
openai.embedding.timeout=120000
openai.llm.timeout=300000

# Retry Configuration
openai.max.retries=5

# HTTP Client Configuration
openai.http.timeout=300000

# Index Configuration
vector.index.top-k=3
summary.index.top-k=3
keyword.index.top-k=3
hybrid.vector-k=5
hybrid.keyword-k=5

# Logging Configuration
logging.level=INFO
logging.format=%-5level [%thread] %logger{36} - %msg%n
